; TetraSki Radio Firmware — PlatformIO project configuration
;
; Uses the pioarduino fork of platform-espressif32, not the official
; PlatformIO one — official PlatformIO's espressif32 platform stalled at an
; older Arduino-ESP32 core and never picked up 3.x. pioarduino release
; 55.03.36 bundles Arduino Core 3.3.6, matching the "esp32 by Espressif
; Systems" board package version this project was built and tested against
; in the Arduino IDE. See: https://github.com/pioarduino/platform-espressif32
;
; To update to a newer Arduino core later, find the matching pioarduino
; release tag here: https://github.com/sivar2311/platform-espressif32-versions

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 57600

lib_deps = h2zero/NimBLE-Arduino @ ^2.5.0

; Sets NimBLE's max simultaneous BLE connections to 4 (default is 3).
build_flags = -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=4

board_build.partitions = min_spiffs.csv